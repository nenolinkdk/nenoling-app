name: Nenoling engine and shell CI

on:
  push:
    branches: [ main ]
    paths:
      - 'template/android/**'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    paths:
      - 'template/android/**'
      - '.github/workflows/engine-ci.yml'
  workflow_dispatch:

jobs:
  reusable-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Run engine unit tests
        run: gradle :engine:testDebugUnitTest --stacktrace

      - name: Assemble engine
        run: gradle :engine:assembleDebug --stacktrace

      - name: Run app-shell unit tests
        run: gradle :app-shell:testDebugUnitTest --stacktrace

      - name: Assemble app shell
        run: gradle :app-shell:assembleDebug --stacktrace
